schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  As regras deste projeto estão em AGENTS.md, na raiz do repositório, e a
  arquitetura está detalhada em docs/arquitetura.md — sempre leia e siga
  esses dois arquivos antes de criar ou aplicar qualquer artefato.
  Resumo: API .NET com Minimal API (nunca Controllers), DDD, TDD, Arquitetura
  Hexagonal (Ports & Adapters), autenticação/autorização via Keycloak,
  containers em containers/ (volumes de dados em containers/data/, ignorado
  pelo git). Domain não pode depender de Infrastructure. Nenhum código de
  produção sem teste correspondente.
  Todo conteúdo escrito (artefatos, documentação, regras) deve ser em português.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
